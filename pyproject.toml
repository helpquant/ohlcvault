[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ohlcvault"
version = "0.2.1"
description = "Reproducible, checksummed daily OHLCV data for A-share, HK and US markets — static files, content-addressed snapshots, zero API keys."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["ohlcv", "market-data", "quant", "backtest", "a-share", "hk-stocks", "us-stocks", "reproducible"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Financial and Insurance Industry",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business :: Financial :: Investment",
]
# 运行期零依赖：核心只用标准库（urllib / gzip / json / hashlib）。
# 这是刻意的 —— 一个数据客户端不该把依赖树带给使用者，尤其在 Agent 场景。
dependencies = []

[project.optional-dependencies]
pandas = ["pandas>=2.0"]
duckdb = ["duckdb>=1.0"]
dev = ["pandas>=2.0", "pytest>=8.0", "ruff>=0.6", "duckdb>=1.0"]

[project.urls]
Homepage = "https://helpquant.com"
Documentation = "https://github.com/helpquant/ohlcvault#readme"
Issues = "https://github.com/helpquant/ohlcvault/issues"

[tool.hatch.build.targets.wheel]
packages = ["ohlcvault"]

[tool.hatch.build.targets.sdist]
include = ["ohlcvault/", "SPEC.md", "schema/", "README.md", "LICENSE", "tests/"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
